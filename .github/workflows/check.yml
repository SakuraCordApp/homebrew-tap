name: Check tap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test script/update-cask.test.mjs
      - name: Validate cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          brew tap --custom-remote SakuraCordApp/tap "$GITHUB_WORKSPACE"
          brew style Casks/sakuracord.rb
          brew audit --cask --online SakuraCordApp/tap/sakuracord
