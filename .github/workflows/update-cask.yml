name: Update cask

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test script/update-cask.test.mjs
      - name: Update from the latest regular release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node script/update-cask.mjs
      - name: Commit changed cask
        run: |
          if git diff --quiet -- Casks/sakuracord.rb; then
            exit 0
          fi
          ruby -c Casks/sakuracord.rb
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/sakuracord.rb
          git commit -m 'Update SakuraCord cask'
          git push origin HEAD:main
